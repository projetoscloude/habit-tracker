<div id="app"></div>
<style>
  :root{
    --ink:#1b1f1c;
    --paper:#f3f1e9;
    --moss:#5c7a5a;
    --moss-dark:#3f5a3e;
    --amber:#c9922f;
    --rust:#a8482f;
    --line:#d9d4c4;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  *{box-sizing:border-box;}
  #app{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    padding:28px 22px 40px;
    border-radius:14px;
    max-width:760px;
    margin:0 auto;
  }
  .eyebrow-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  .sub{color:#a9a595;font-size:13px;margin-bottom:26px;}

  .cards{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:26px;}
  .card{
    background:#22271f;
    border:1px solid #333a2d;
    border-radius:10px;
    padding:14px 16px;
  }
  .card .label{font-size:11px;color:#9a9684;margin-bottom:6px;}
  .card .value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--paper);}
  .card .value.small{font-size:15px;}
  .bar-track{height:6px;background:#333a2d;border-radius:4px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--moss);border-radius:4px;transition:width .5s ease;}

  .section-title{
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid #333a2d;
  }

  form.entry{
    background:#22271f;
    border:1px solid #333a2d;
    border-radius:10px;
    padding:16px;
    margin-bottom:28px;
  }
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;}
  .toggle-btn{
    flex:1;padding:8px 0;border-radius:7px;border:1px solid #3a4230;
    background:transparent;color:#a9a595;font-family:var(--sans);font-size:13px;font-weight:500;
    cursor:pointer;
  }
  .toggle-btn.active{background:var(--moss);border-color:var(--moss);color:var(--ink);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:#9a9684;margin-bottom:4px;}
  .field input, .field select{
    width:100%;background:#1b1f1c;border:1px solid #3a4230;border-radius:6px;
    color:var(--paper);padding:8px 9px;font-family:var(--sans);font-size:13px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--moss);}
  .hint{font-size:11px;color:#8a8674;margin-top:-4px;margin-bottom:10px;}

  .submit-btn{
    width:100%;background:var(--moss);color:var(--ink);border:none;border-radius:7px;
    padding:10px 0;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;margin-top:4px;
  }
  .submit-btn:hover{background:#6b8c68;}

  .committed{margin-bottom:28px;}
  .committed-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;border-bottom:1px solid #2a2f25;font-size:13px;
  }
  .committed-row .mes{color:#c5c1ae;}
  .committed-row .num{font-family:var(--mono);}
  .committed-row .num.neg{color:var(--rust);}
  .committed-row .num.pos{color:var(--moss);}

  .log-item{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:10px 2px;border-bottom:1px solid #2a2f25;font-size:13px;gap:10px;
  }
  .log-item .desc{flex:1;}
  .log-item .cat{color:#c5c1ae;font-weight:500;}
  .log-item .meta{color:#8a8674;font-size:11px;margin-top:2px;}
  .log-item .amt{font-family:var(--mono);white-space:nowrap;}
  .amt.gasto{color:var(--rust);}
  .amt.aporte{color:var(--moss);}
  .del{background:none;border:none;color:#6b6858;cursor:pointer;font-size:15px;padding:0 4px;}
  .del:hover{color:var(--rust);}
  .empty{color:#8a8674;font-size:13px;padding:14px 2px;font-style:italic;}
</style>

<script>
(function(){
  const CONFIG = { renda: 6500, meta: 100000, patrimonioBase: 33417.98, dataBase: '2026-09-01', aporteAlvo: 2000 };

  function fmt(n){
    const neg = n < 0;
    const v = Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    return (neg?'-R$ ':'R$ ') + v;
  }
  function monthKey(d){ return d.slice(0,7); } // YYYY-MM
  function addMonths(ym, n){
    let [y,m] = ym.split('-').map(Number);
    m += n;
    while(m>12){m-=12;y++;}
    while(m<1){m+=12;y--;}
    return y+'-'+String(m).padStart(2,'0');
  }
  function monthLabel(ym){
    const [y,m] = ym.split('-').map(Number);
    const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return nomes[m-1]+'/'+y;
  }
  function parseValor(str){
    str = (str||'').trim();
    if(str.includes(',')){
      str = str.replace(/\./g,'').replace(',', '.');
    }
    const n = parseFloat(str);
    return isNaN(n) ? 0 : n;
  }
  function todayYM(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }

  let transacoes = [];

  let seedsRemoved = [];

  async function load(){
    try{
      transacoes = JSON.parse(localStorage.getItem('transacoes') || '[]');
    }catch(e){ transacoes = []; }
    try{
      seedsRemoved = JSON.parse(localStorage.getItem('seeds_removed') || '[]');
    }catch(e){ seedsRemoved = []; }

    const seedEntries = [
      { id:'seed-out', tipo:'gasto', data:'2026-10-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:4930.45, parcelaAtual:1, parcelaTotal:1 },
      { id:'seed-nov', tipo:'gasto', data:'2026-11-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:2394.24, parcelaAtual:1, parcelaTotal:1 },
      { id:'seed-dez', tipo:'gasto', data:'2026-12-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:2241.24, parcelaAtual:1, parcelaTotal:1 },
    ];
    let changed = false;
    seedEntries.forEach(seed=>{
      if(!seedsRemoved.includes(seed.id) && !transacoes.some(t=>t.id===seed.id)){
        transacoes.push(seed);
        changed = true;
      }
    });
    if(changed){ await save(); }

    render();
  }
  async function save(){
    localStorage.setItem('transacoes', JSON.stringify(transacoes));
  }

  function projectedMonthsFor(tx){
    // gasto: parcelaAtual..parcelaTotal starting at tx.data's month
    const out = [];
    const restantes = tx.parcelaTotal - tx.parcelaAtual + 1;
    const startYM = monthKey(tx.data);
    for(let i=0;i<restantes;i++){
      out.push(addMonths(startYM, i));
    }
    return out;
  }

  function committedByMonth(){
    const map = {};
    transacoes.filter(t=>t.tipo==='gasto').forEach(t=>{
      projectedMonthsFor(t).forEach(ym=>{
        map[ym] = (map[ym]||0) + t.valor;
      });
    });
    return map;
  }

  function patrimonioAtual(){
    const aportes = transacoes.filter(t=>t.tipo==='aporte').reduce((s,t)=>s+t.valor,0);
    return CONFIG.patrimonioBase + aportes;
  }

  function render(){
    const map = committedByMonth();
    const cur = todayYM();
    const gastoAtual = map[cur] || 0;
    const sobraAtual = CONFIG.renda - gastoAtual;
    const patr = patrimonioAtual();
    const pct = Math.min(100, (patr/CONFIG.meta)*100);
    const falta = Math.max(0, CONFIG.meta - patr);
    const mesesEstimados = falta>0 ? Math.ceil(falta/CONFIG.aporteAlvo) : 0;

    const proximosMeses = [1,2,3].map(i=>addMonths(cur,i));

    document.getElementById('app').innerHTML = `
      <div class="eyebrow-row">
        <h1>Controle financeiro</h1>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">Patrimônio investido</div>
          <div class="value">${fmt(patr)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="card">
          <div class="label">Aporte mensal (meta)</div>
          <div class="value small">${fmt(CONFIG.aporteAlvo)}</div>
        </div>
        <div class="card">
          <div class="label">Faltam p/ meta</div>
          <div class="value small">${mesesEstimados>0 ? mesesEstimados+' meses' : 'concluído'}</div>
        </div>
      </div>

      <div class="committed">
        <div class="section-title">Comprometido conhecido (próximos meses)</div>
        ${proximosMeses.map(ym=>{
          const g = map[ym]||0;
          const s = CONFIG.renda - g;
          return `<div class="committed-row">
            <span class="mes">${monthLabel(ym)}</span>
            <span class="num">${fmt(g)} gasto &nbsp;→&nbsp; <span class="${s>=0?'pos':'neg'}">${fmt(s)} sobra</span></span>
          </div>`;
        }).join('')}
      </div>

      <form class="entry" id="entryForm">
        <div class="toggle-row">
          <button type="button" class="toggle-btn active" data-tipo="gasto">Gasto</button>
          <button type="button" class="toggle-btn" data-tipo="aporte">Aporte</button>
        </div>

        <div class="grid2">
          <div class="field">
            <label>Data (mês desta fatura/aporte)</label>
            <input type="date" id="f_data" required>
          </div>
          <div class="field">
            <label>Valor (da parcela, se houver)</label>
            <input type="text" inputmode="decimal" id="f_valor" placeholder="0,00" required>
          </div>
        </div>

        <div id="camposGasto">
          <div class="grid2">
            <div class="field">
              <label>Categoria</label>
              <input type="text" id="f_categoria" placeholder="Moradia, Alimentação...">
            </div>
            <div class="field">
              <label>Descrição</label>
              <input type="text" id="f_subcategoria" placeholder="Aluguel, mercado...">
            </div>
          </div>
          <div class="grid2">
            <div class="field">
              <label>Parcela atual</label>
              <input type="number" min="1" id="f_parcelaAtual" value="1">
            </div>
            <div class="field">
              <label>Total de parcelas</label>
              <input type="number" min="1" id="f_parcelaTotal" value="1">
            </div>
          </div>
          <div class="hint">Se for à vista, deixe 1 e 1. Se for parcela 3 de 10, preenche 3 e 10 — o app já projeta os meses restantes.</div>
        </div>

        <div id="camposAporte" style="display:none">
          <div class="field">
            <label>Destino</label>
            <input type="text" id="f_destino" placeholder="Renda fixa, VOO, BTC...">
          </div>
        </div>

        <button type="submit" class="submit-btn">Adicionar</button>
      </form>

      <div class="section-title">Lançamentos recentes</div>
      <div id="log">
        ${transacoes.length===0 ? '<div class="empty">Nenhum lançamento ainda. Adicione o primeiro acima.</div>' :
          transacoes.slice().reverse().map(t=>`
            <div class="log-item">
              <div class="desc">
                <div class="cat">${t.tipo==='gasto' ? (t.categoria||'Gasto') : 'Aporte'} ${t.tipo==='gasto' && t.subcategoria ? '· '+t.subcategoria : ''}</div>
                <div class="meta">
                  ${monthLabel(monthKey(t.data))}
                  ${t.tipo==='gasto' && t.parcelaTotal>1 ? ' · parcela '+t.parcelaAtual+'/'+t.parcelaTotal : ''}
                  ${t.tipo==='aporte' && t.destino ? ' · '+t.destino : ''}
                </div>
              </div>
              <div class="amt ${t.tipo}">${t.tipo==='gasto'?'-':'+'}${fmt(t.valor)}</div>
              <button class="del" data-id="${t.id}" title="remover">×</button>
            </div>
          `).join('')
        }
      </div>
    `;

    // wire up toggle
    let tipoAtual = 'gasto';
    document.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        tipoAtual = btn.dataset.tipo;
        document.getElementById('camposGasto').style.display = tipoAtual==='gasto' ? 'block':'none';
        document.getElementById('camposAporte').style.display = tipoAtual==='aporte' ? 'block':'none';
      });
    });

    document.getElementById('entryForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const tx = {
        id: Date.now().toString(),
        tipo: tipoAtual,
        data: document.getElementById('f_data').value,
        valor: parseValor(document.getElementById('f_valor').value),
      };
      if(tipoAtual==='gasto'){
        tx.categoria = document.getElementById('f_categoria').value;
        tx.subcategoria = document.getElementById('f_subcategoria').value;
        tx.parcelaAtual = parseInt(document.getElementById('f_parcelaAtual').value)||1;
        tx.parcelaTotal = parseInt(document.getElementById('f_parcelaTotal').value)||1;
      } else {
        tx.destino = document.getElementById('f_destino').value;
      }
      if(!tx.data || !tx.valor){ return; }
      transacoes.push(tx);
      await save();
      render();
    });

    document.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        if(id.startsWith('seed-') && !seedsRemoved.includes(id)){
          seedsRemoved.push(id);
          localStorage.setItem('seeds_removed', JSON.stringify(seedsRemoved));
        }
        transacoes = transacoes.filter(t=>t.id!==id);
        await save();
        render();
      });
    });
  }

  load();
})();
</script>
