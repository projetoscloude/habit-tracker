<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#1b1f1c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1f1c;
    --panel:#22271f;
    --edge:#333a2d;
    --paper:#f3f1e9;
    --muted:#9a9684;
    --moss:#5c7a5a;
    --rust:#c77a63;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
    min-height:100dvh;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(40px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }

  #app{ max-width:720px; margin:0 auto; }

  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(22px, 6vw, 28px);
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }

  /* ---- cards ---- */
  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:28px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:12px;
    padding:14px 16px;
    min-width:0;
  }
  .card .label{ font-size:11px; color:var(--muted); margin-bottom:6px; }
  .card .value{
    font-family:var(--mono);
    font-size:clamp(17px, 5vw, 22px);
    font-weight:600;
    letter-spacing:-0.02em;
    overflow-wrap:anywhere;
  }
  .card.small .value{ font-size:clamp(14px, 4vw, 16px); }

  .section-title{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--edge);
  }

  /* ---- committed list ---- */
  .committed{ margin-bottom:28px; }
  .committed-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:baseline;
    gap:2px 10px;
    padding:11px 2px;
    border-bottom:1px solid #2a2f25;
    font-size:13px;
  }
  .committed-row{ cursor:pointer; border-radius:6px; transition:background .15s ease; }
  .committed-row:hover{ background:#262c21; }
  .committed-row.active{ background:#2a3324; margin:0 -8px; padding-left:10px; padding-right:10px; }
  .committed-row.active .mes{ color:var(--paper); }
  .committed-row .mes{ color:#c5c1ae; font-weight:500; }
  .committed-row .nums{ font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  .committed-row .neg{ color:var(--rust); }
  .committed-row .pos{ color:#8fb08c; }

  /* ---- gasto por categoria ---- */
  .pie-section{ margin-bottom:28px; }
  .pie-hint{ font-size:11.5px; color:#8a8674; margin:-4px 0 14px; }
  .pie-legend{ display:flex; flex-direction:column; }
  .pie-legend-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:2px 10px;
    padding:10px 2px;
    border-bottom:1px solid #2a2f25;
    font-size:13px;
  }
  .pie-legend-cat{ color:#c5c1ae; font-weight:500; overflow-wrap:anywhere; }
  .pie-legend-num{ font-family:var(--mono); font-size:12.5px; color:var(--paper); white-space:nowrap; }
  .pie-empty{ color:#8a8674; font-size:13px; font-style:italic; }

  /* ---- form ---- */
  form.entry{
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:12px;
    padding:16px;
    margin-bottom:28px;
  }
  .toggle-row{ display:flex; gap:8px; margin-bottom:16px; }
  .toggle-btn{
    flex:1; padding:11px 0; border-radius:8px; border:1px solid #3a4230;
    background:transparent; color:#a9a595;
    font-family:var(--sans); font-size:14px; font-weight:500;
    cursor:pointer; -webkit-appearance:none;
  }
  .toggle-btn.active{ background:var(--moss); border-color:var(--moss); color:var(--ink); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field{ margin-bottom:12px; min-width:0; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; }
  .field input{
    width:100%;
    background:var(--ink);
    border:1px solid #3a4230;
    border-radius:8px;
    color:var(--paper);
    padding:11px 10px;
    font-family:var(--sans);
    font-size:16px; /* 16px evita zoom automático no iOS */
    -webkit-appearance:none;
  }
  .field input:focus{ outline:none; border-color:var(--moss); }
  .hint{ font-size:11.5px; color:#8a8674; line-height:1.5; margin:-2px 0 12px; }

  .submit-btn{
    width:100%;
    background:var(--moss); color:var(--ink);
    border:none; border-radius:8px;
    padding:13px 0;
    font-family:var(--sans); font-weight:600; font-size:15px;
    cursor:pointer; -webkit-appearance:none;
  }

  /* ---- log ---- */
  .log-item{
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:start;
    column-gap:10px;
    padding:12px 2px;
    border-bottom:1px solid #2a2f25;
    font-size:13px;
  }
  .log-item .cat{ color:#c5c1ae; font-weight:500; line-height:1.4; }
  .log-item .meta{ color:#8a8674; font-size:11px; margin-top:3px; }
  .log-item .amt{ font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  .amt.gasto{ color:var(--rust); }
  .amt.aporte{ color:#8fb08c; }
  .del{
    background:none; border:none; color:#6b6858;
    cursor:pointer; font-size:18px; line-height:1;
    padding:0 0 0 6px; -webkit-appearance:none;
  }
  .empty{ color:#8a8674; font-size:13px; padding:16px 2px; font-style:italic; }

  /* ---- telas maiores ---- */
  @media (min-width:560px){
    .committed-row .nums{ font-size:13px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const CONFIG = {
    renda: 6500,
    meta: 100000,
    patrimonioBase: 33417.98,
    aporteAlvo: 2000,
    retornoAnual: 0.13,
    diaFechamento: 10
  };

  function fmt(n){
    const neg = n < 0;
    const v = Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    return (neg ? '-R$ ' : 'R$ ') + v;
  }
  function monthKey(d){ return d.slice(0,7); }
  // Data da compra -> mes da fatura, considerando o dia de fechamento do cartao.
  // Compra depois do dia de fechamento cai na fatura do mes seguinte.
  function faturaMonthFor(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    let fy = y, fm = m;
    if(d > CONFIG.diaFechamento){
      fm += 1;
      if(fm > 12){ fm = 1; fy += 1; }
    }
    return fy + '-' + String(fm).padStart(2,'0');
  }
  function addMonths(ym, n){
    let [y,m] = ym.split('-').map(Number);
    m += n;
    while(m>12){ m-=12; y++; }
    while(m<1){ m+=12; y--; }
    return y+'-'+String(m).padStart(2,'0');
  }
  function monthLabel(ym){
    const [y,m] = ym.split('-').map(Number);
    const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return nomes[m-1]+'/'+y;
  }
  function parseValor(str){
    str = (str||'').trim();
    if(str.includes(',')){
      str = str.replace(/\./g,'').replace(',', '.');
    }
    const n = parseFloat(str);
    return isNaN(n) ? 0 : n;
  }
  function todayYM(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }

  let transacoes = [];
  let seedsRemoved = [];
  let mesSelecionado = null;

  function categoriasDoMes(ym){
    const map = {};
    transacoes.filter(function(t){ return t.tipo==='gasto'; }).forEach(function(t){
      if(projectedMonthsFor(t).indexOf(ym) !== -1){
        const cat = t.categoria || 'Outros';
        map[cat] = (map[cat]||0) + t.valor;
      }
    });
    return Object.keys(map)
      .map(function(cat){ return { categoria:cat, valor:map[cat] }; })
      .sort(function(a,b){ return b.valor - a.valor; });
  }

  function load(){
    try{
      transacoes = JSON.parse(localStorage.getItem('transacoes') || '[]');
    }catch(e){ transacoes = []; }
    try{
      seedsRemoved = JSON.parse(localStorage.getItem('seeds_removed') || '[]');
    }catch(e){ seedsRemoved = []; }

    const seedEntries = [
      { id:'seed-out', tipo:'gasto', data:'2026-10-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:4930.45, parcelaAtual:1, parcelaTotal:1 },
      { id:'seed-nov', tipo:'gasto', data:'2026-11-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:2394.24, parcelaAtual:1, parcelaTotal:1 },
      { id:'seed-dez', tipo:'gasto', data:'2026-12-01', categoria:'Comprometido (importado)', subcategoria:'Total da fatura conforme planilha original', valor:2241.24, parcelaAtual:1, parcelaTotal:1 }
    ];
    let changed = false;
    seedEntries.forEach(function(seed){
      if(seedsRemoved.indexOf(seed.id) === -1 && !transacoes.some(function(t){ return t.id === seed.id; })){
        transacoes.push(seed);
        changed = true;
      }
    });
    if(changed){ save(); }

    render();
  }
  function save(){
    localStorage.setItem('transacoes', JSON.stringify(transacoes));
  }

  function projectedMonthsFor(tx){
    const out = [];
    const restantes = tx.parcelaTotal - tx.parcelaAtual + 1;
    const startYM = faturaMonthFor(tx.data);
    for(let i=0;i<restantes;i++){ out.push(addMonths(startYM, i)); }
    return out;
  }

  function committedByMonth(){
    const map = {};
    transacoes.filter(function(t){ return t.tipo==='gasto'; }).forEach(function(t){
      projectedMonthsFor(t).forEach(function(ym){
        map[ym] = (map[ym]||0) + t.valor;
      });
    });
    return map;
  }

  function patrimonioAtual(){
    const aportes = transacoes
      .filter(function(t){ return t.tipo==='aporte'; })
      .reduce(function(s,t){ return s + t.valor; }, 0);
    return CONFIG.patrimonioBase + aportes;
  }

  // meses até a meta considerando rendimento composto
  function mesesAteMeta(valorAtual){
    if(valorAtual >= CONFIG.meta) return 0;
    const r = Math.pow(1 + CONFIG.retornoAnual, 1/12) - 1;
    let v = valorAtual, n = 0;
    while(v < CONFIG.meta && n < 600){
      v = v * (1 + r) + CONFIG.aporteAlvo;
      n++;
    }
    return n;
  }

  function render(){
    const map = committedByMonth();
    const cur = todayYM();
    const patr = patrimonioAtual();
    const meses = mesesAteMeta(patr);
    const proximosMeses = [1,2,3].map(function(i){ return addMonths(cur, i); });
    const mesAtivo = (mesSelecionado && proximosMeses.indexOf(mesSelecionado) !== -1) ? mesSelecionado : proximosMeses[0];
    const catsAtivo = categoriasDoMes(mesAtivo);
    const totalAtivo = catsAtivo.reduce(function(s,c){ return s + c.valor; }, 0);

    let html = ''
      + '<h1>Controle financeiro</h1>'
      + '<div class="cards">'
      +   '<div class="card small">'
      +     '<div class="label">Aporte mensal (meta)</div>'
      +     '<div class="value">' + fmt(CONFIG.aporteAlvo) + '</div>'
      +   '</div>'
      +   '<div class="card small">'
      +     '<div class="label">Faltam p/ meta</div>'
      +     '<div class="value">' + (meses > 0 ? meses + ' meses' : 'conclu\u00eddo') + '</div>'
      +   '</div>'
      + '</div>'

      + '<div class="committed">'
      +   '<div class="section-title">Comprometido conhecido</div>'
      +   proximosMeses.map(function(ym){
            const g = map[ym] || 0;
            const s = CONFIG.renda - g;
            return '<div class="committed-row' + (ym===mesAtivo ? ' active' : '') + '" data-ym="' + ym + '">'
                 +   '<span class="mes">' + monthLabel(ym) + '</span>'
                 +   '<span class="nums">' + fmt(g) + ' \u00b7 '
                 +     '<span class="' + (s>=0 ? 'pos' : 'neg') + '">' + fmt(s) + ' sobra</span>'
                 +   '</span>'
                 + '</div>';
          }).join('')
      + '</div>'

      + '<form class="entry" id="entryForm">'
      +   '<div class="toggle-row">'
      +     '<button type="button" class="toggle-btn active" data-tipo="gasto">Gasto</button>'
      +     '<button type="button" class="toggle-btn" data-tipo="aporte">Aporte</button>'
      +   '</div>'
      +   '<div class="grid2">'
      +     '<div class="field"><label>Data</label><input type="date" id="f_data" required></div>'
      +     '<div class="field"><label>Valor</label><input type="text" inputmode="decimal" id="f_valor" placeholder="0,00" required></div>'
      +   '</div>'
      +   '<div id="camposGasto">'
      +     '<div class="field"><label>Categoria</label><input type="text" id="f_categoria" placeholder="Moradia, Alimenta\u00e7\u00e3o..."></div>'
      +     '<div class="field"><label>Descri\u00e7\u00e3o</label><input type="text" id="f_subcategoria" placeholder="Aluguel, mercado..."></div>'
      +     '<div class="grid2">'
      +       '<div class="field"><label>Parcela atual</label><input type="number" min="1" id="f_parcelaAtual" value="1"></div>'
      +       '<div class="field"><label>Total de parcelas</label><input type="number" min="1" id="f_parcelaTotal" value="1"></div>'
      +     '</div>'
      +     '<div class="hint">\u00c0 vista: deixe 1 e 1. Parcela 3 de 10: preencha 3 e 10 \u2014 os meses restantes s\u00e3o projetados sozinhos.</div>'
      +   '</div>'
      +   '<div id="camposAporte" style="display:none">'
      +     '<div class="field"><label>Destino</label><input type="text" id="f_destino" placeholder="Renda fixa, VOO, BTC..."></div>'
      +   '</div>'
      +   '<button type="submit" class="submit-btn">Adicionar</button>'
      + '</form>'

      + '<div class="pie-section">'
      +   '<div class="section-title">Gasto por categoria \u2014 fatura ' + monthLabel(mesAtivo) + '</div>'
      +   '<div class="pie-hint">Toque em um m\u00eas em "Comprometido conhecido" acima para ver outra fatura.</div>'
      +   (totalAtivo > 0
          ? '<div class="pie-legend">'
            +   catsAtivo.map(function(c){
                  const pctCat = (c.valor / totalAtivo) * 100;
                  return '<div class="pie-legend-row">'
                       +   '<span class="pie-legend-cat">' + c.categoria + '</span>'
                       +   '<span class="pie-legend-num">' + pctCat.toFixed(1) + '% \u00b7 ' + fmt(c.valor) + '</span>'
                       + '</div>';
                }).join('')
            + '</div>'
          : '<div class="pie-empty">Nenhum gasto categorizado lan\u00e7ado para esta fatura ainda.</div>')
      + '</div>'

      + '<div class="section-title">Lan\u00e7amentos recentes</div>'
      + '<div id="log">'
      +   (transacoes.length === 0
          ? '<div class="empty">Nenhum lan\u00e7amento ainda.</div>'
          : transacoes.slice().reverse().map(function(t){
              const titulo = t.tipo==='gasto' ? (t.categoria || 'Gasto') : 'Aporte';
              const desc = (t.tipo==='gasto' && t.subcategoria) ? ' \u00b7 ' + t.subcategoria : '';
              let meta = t.tipo==='gasto'
                ? ('fatura ' + monthLabel(faturaMonthFor(t.data)))
                : monthLabel(monthKey(t.data));
              if(t.tipo==='gasto' && t.parcelaTotal > 1){ meta += ' \u00b7 parcela ' + t.parcelaAtual + '/' + t.parcelaTotal; }
              if(t.tipo==='aporte' && t.destino){ meta += ' \u00b7 ' + t.destino; }
              return '<div class="log-item">'
                   +   '<div><div class="cat">' + titulo + desc + '</div><div class="meta">' + meta + '</div></div>'
                   +   '<div class="amt ' + t.tipo + '">' + (t.tipo==='gasto' ? '-' : '+') + fmt(t.valor) + '</div>'
                   +   '<button class="del" data-id="' + t.id + '" aria-label="remover">\u00d7</button>'
                   + '</div>';
            }).join(''))
      + '</div>';

    document.getElementById('app').innerHTML = html;

    document.querySelectorAll('.committed-row').forEach(function(row){
      row.addEventListener('click', function(){
        mesSelecionado = row.dataset.ym;
        render();
      });
    });

    let tipoAtual = 'gasto';
    document.querySelectorAll('.toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        tipoAtual = btn.dataset.tipo;
        document.getElementById('camposGasto').style.display = tipoAtual==='gasto' ? 'block' : 'none';
        document.getElementById('camposAporte').style.display = tipoAtual==='aporte' ? 'block' : 'none';
      });
    });

    document.getElementById('entryForm').addEventListener('submit', function(e){
      e.preventDefault();
      const tx = {
        id: Date.now().toString(),
        tipo: tipoAtual,
        data: document.getElementById('f_data').value,
        valor: parseValor(document.getElementById('f_valor').value)
      };
      if(tipoAtual === 'gasto'){
        tx.categoria = document.getElementById('f_categoria').value;
        tx.subcategoria = document.getElementById('f_subcategoria').value;
        tx.parcelaAtual = parseInt(document.getElementById('f_parcelaAtual').value) || 1;
        tx.parcelaTotal = parseInt(document.getElementById('f_parcelaTotal').value) || 1;
      } else {
        tx.destino = document.getElementById('f_destino').value;
      }
      if(!tx.data || !tx.valor){ return; }
      transacoes.push(tx);
      save();
      render();
    });

    document.querySelectorAll('.del').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = btn.dataset.id;
        if(id.indexOf('seed-') === 0 && seedsRemoved.indexOf(id) === -1){
          seedsRemoved.push(id);
          localStorage.setItem('seeds_removed', JSON.stringify(seedsRemoved));
        }
        transacoes = transacoes.filter(function(t){ return t.id !== id; });
        save();
        render();
      });
    });
  }

  load();
})();
</script>
</body>
</html>
